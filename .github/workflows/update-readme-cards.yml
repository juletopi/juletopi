name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&count_private=false&include_all_commits=true&theme=codeSTACKr&custom_title=Juletopi's%20GitHub%20Stats&title_color=e73737&icon_color=e73737&border_color=0d1017&bg_color=0e1118&disable_animations=true
          path: assets/cards/stats-card.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=10&theme=codeSTACKr&custom_title=Juletopi's%20Top%20Langs%20(By%20File%20Size)&title_color=e73737&icon_color=e73737&border_color=0e1118&bg_color=0e1118&disable_animations=true
          path: assets/cards/top-langs-card.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: bg_color=0e1118&hide_border=true&custom_title=Juletopi's%20Contribution%20Graph&area=true&area_color=e73737&title_color=e73737&line=e73737&point=e73737&theme=high-contrast
          output_path: assets/cards/contribution-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution graph (pt)
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: bg_color=0e1118&hide_border=true&custom_title=Gr%C3%A1fico%20de%20Contribui%C3%A7%C3%A3o%20de%20Juletopi&area=true&area_color=e73737&title_color=e73737&line=e73737&point=e73737&theme=high-contrast
          output_path: assets/cards/contribution-graph-pt.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card - PontuaDev_Project
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=PontuaDev_Project&theme=react&bg_color=0e1118&border_color=32394c&title_color=e73737&icon_color=ffffff&show_icons=true
          path: assets/cards/pontuadev-card.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card - JCPC_Portfolio
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=JCPC_Portfolio&theme=react&bg_color=0e1118&border_color=32394c&title_color=e73737&icon_color=ffffff&show_icons=true
          path: assets/cards/portfolio-card.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card - Pagina_Cyberpunk-Edgerunners
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Pagina_Cyberpunk-Edgerunners&theme=react&bg_color=0e1118&border_color=32394c&title_color=e73737&icon_color=ffffff&show_icons=true
          path: assets/cards/cyberpunk-card.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card - guardaRoupaApp
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=guardaRoupaApp&theme=react&bg_color=0e1118&border_color=32394c&title_color=e73737&icon_color=ffffff&show_icons=true
          path: assets/cards/guardaroupa-card.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards/*.svg
          git commit -m "doc auto-update README cards" || exit 0
          git push

  check-spotify-widget:
    runs-on: ubuntu-latest

    steps:
      - name: Check Spotify widget auth and token expiry
        env:
          HEALTH_URL: https://music-player-widget-ten.vercel.app/api/spotify/health/auth
          MIN_DAYS: 14 # Fails when the refresh token expires in fewer days than this
        run: |
          status=$(curl -s -o health.json -w "%{http_code}" "$HEALTH_URL")
          body=$(cat health.json 2>/dev/null)

          if [ "$status" != "200" ]; then
            echo "::error title=Spotify widget::/health/auth returned HTTP $status: $body"
            exit 1
          fi

          days=$(jq -r '.days_remaining' health.json)
          expires=$(jq -r '.expires_on' health.json)

          case "$days" in
            null)
              echo "::warning title=Spotify widget::SPOTIFY_REFRESH_TOKEN_DATE is not set on Vercel, so token expiry can't be checked"
              ;;
            ''|*[!0-9-]*)
              echo "::error title=Spotify widget::Unexpected days_remaining in /health/auth response: $body"
              exit 1
              ;;
            *)
              if [ "$days" -lt "$MIN_DAYS" ]; then
                echo "::error title=Spotify widget::Spotify refresh token expires in $days days ($expires). Renew it with scripts/get_token.py from musicPlayerWidget"
                exit 1
              fi
              ;;
          esac

          echo "Spotify widget OK: $body"
